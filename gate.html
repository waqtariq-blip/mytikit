<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gate Scanner — mytikit</title>
<!-- jsQR — reliable browser QR scanning -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #06291A; min-height: 100vh; display: flex; flex-direction: column; }
.gate-nav { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
.gate-logo { font-size: 16px; font-weight: 800; color: #fff; }
.gate-label { font-size: 12px; color: #6b9e80; }
.gate-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

/* MODE TABS */
.mode-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.mode-tab { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; text-align: center; transition: all 0.2s; max-width: 180px; }
.mode-tab.active { background: #fff; color: #06291A; border-color: #fff; }

/* CAMERA SCANNER */
.camera-box { width: 100%; max-width: 380px; margin-bottom: 16px; }
.camera-wrap { position: relative; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 1; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
.camera-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.scan-frame { width: 60%; aspect-ratio: 1; border: 3px solid #4ade80; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45); }
.scan-line { position: absolute; left: 20%; right: 20%; height: 2px; background: #4ade80; animation: scanline 2s ease-in-out infinite; box-shadow: 0 0 8px #4ade80; }
@keyframes scanline { 0%,100% { top: 20%; } 50% { top: 80%; } }
.camera-status { text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 10px; }
.btn-camera { width: 100%; margin-top: 12px; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.2); color: #fff; font-size: 14px; font-weight: 700; padding: 12px; border-radius: 10px; cursor: pointer; font-family: inherit; }
.btn-camera:active { opacity: 0.8; }
.btn-camera.stop { background: rgba(248,113,113,0.2); border-color: #f87171; color: #f87171; }

/* INPUT AREA */
.scan-box { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 28px; width: 100%; max-width: 380px; margin-bottom: 20px; }
.scan-label { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #6b9e80; margin-bottom: 12px; }
.scan-input { width: 100%; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 14px 16px; font-size: 18px; font-weight: 700; font-family: monospace; color: #fff; outline: none; text-transform: uppercase; letter-spacing: 2px; }
.scan-input::placeholder { color: rgba(255,255,255,0.3); font-weight: 400; letter-spacing: 0; font-family: -apple-system, sans-serif; font-size: 15px; }
.scan-input:focus { border-color: #4ade80; }
.scan-btn { width: 100%; margin-top: 14px; background: #fff; color: #06291A; font-size: 16px; font-weight: 800; padding: 15px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; }
.scan-btn:active { opacity: 0.85; }
.scan-hint { text-align: center; font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 10px; }

/* RESULT */
.result-card { width: 100%; max-width: 380px; border-radius: 16px; padding: 28px; text-align: center; display: none; animation: pop 0.3s ease; }
@keyframes pop { 0%{transform:scale(0.9);opacity:0} 100%{transform:scale(1);opacity:1} }
.result-card.valid   { background: #eaf4ed; border: 2px solid #4ade80; }
.result-card.invalid { background: #fdf2f2; border: 2px solid #f87171; }
.result-card.used    { background: #fef3e2; border: 2px solid #f59e0b; }
.result-icon { font-size: 56px; margin-bottom: 10px; }
.result-status { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.result-card.valid .result-status   { color: #06291A; }
.result-card.invalid .result-status { color: #dc2626; }
.result-card.used .result-status    { color: #d97706; }
.result-name { font-size: 22px; font-weight: 800; color: #111; margin-bottom: 4px; }
.result-detail { font-size: 14px; color: #666; margin-bottom: 4px; }
.result-code { font-size: 12px; font-family: monospace; color: #aaa; margin-top: 6px; }
.result-plus { display: inline-block; background: #06291A; color: #fff; font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 100px; margin-top: 10px; }
.result-table { display: inline-block; background: #f0f0f0; color: #333; font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 100px; margin-top: 6px; margin-left: 6px; }
.next-btn { width: 100%; margin-top: 18px; background: #06291A; color: #fff; font-size: 15px; font-weight: 700; padding: 14px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; }
.next-btn.light { background: #fff; color: #06291A; }

/* STATS BAR */
.stats-bar { background: rgba(0,0,0,0.25); padding: 14px 20px; display: flex; justify-content: center; gap: 40px; }
.stat { text-align: center; }
.stat-n { font-size: 24px; font-weight: 800; color: #fff; }
.stat-l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #6b9e80; }
</style>
</head>
<body>
<div class="gate-nav">
  <div class="gate-logo">mytikit</div>
  <div class="gate-label">Gate Scanner</div>
</div>

<div class="gate-main">

  <!-- MODE TABS -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-camera" onclick="setMode('camera')">📷 Scan QR</button>
    <button class="mode-tab" id="tab-manual" onclick="setMode('manual')">⌨ Type code</button>
  </div>

  <!-- CAMERA MODE -->
  <div class="camera-box" id="camera-box">
    <div class="camera-wrap">
      <video id="preview" playsinline></video>
      <div class="camera-overlay">
        <div class="scan-frame"></div>
        <div class="scan-line"></div>
      </div>
    </div>
    <div class="camera-status" id="camera-status">Tap below to start camera</div>
    <button class="btn-camera" id="camera-btn" onclick="toggleCamera()">▶ Start camera</button>
  </div>

  <!-- MANUAL MODE -->
  <div class="scan-box" id="scan-box" style="display:none;">
    <div class="scan-label">Enter invite code</div>
    <input type="text" class="scan-input" id="code-input" placeholder="INV-XXXXXX" maxlength="10" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkIn()">
    <button class="scan-btn" id="check-btn" onclick="checkIn()">Check in guest</button>
    <div class="scan-hint" id="scan-hint">Type the code or use a hardware QR scanner</div>
  </div>

  <!-- RESULT -->
  <div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-status" id="result-status"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-detail" id="result-detail"></div>
    <div class="result-code" id="result-code"></div>
    <div id="result-extras"></div>
    <button class="next-btn" id="next-btn" onclick="reset()">Scan next guest</button>
  </div>

</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-n" id="stat-checked">0</div><div class="stat-l">Checked in</div></div>
  <div class="stat"><div class="stat-n" id="stat-rejected">0</div><div class="stat-l">Rejected</div></div>
  <div class="stat"><div class="stat-n" id="stat-total">0</div><div class="stat-l">Total scans</div></div>
</div>

<script>
let stats = { checked: 0, rejected: 0, total: 0 };
let currentMode = 'camera';
let cameraRunning = false;
let scanning = false;
let rafId = null;
let canvas = document.createElement('canvas');
let ctx2d = canvas.getContext('2d');

// ── MODE SWITCHING ─────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  document.getElementById('tab-camera').classList.toggle('active', mode === 'camera');
  document.getElementById('tab-manual').classList.toggle('active', mode === 'manual');
  document.getElementById('camera-box').style.display = mode === 'camera' ? 'block' : 'none';
  document.getElementById('scan-box').style.display = mode === 'manual' ? 'block' : 'none';
  if (mode === 'manual') {
    stopCamera();
    document.getElementById('code-input').focus();
  }
}

// ── CAMERA ─────────────────────────────────────────────────────────
async function toggleCamera() {
  if (cameraRunning) { stopCamera(); return; }
  startCamera();
}

async function startCamera() {
  const statusEl = document.getElementById('camera-status');
  const btn = document.getElementById('camera-btn');
  statusEl.textContent = 'Requesting camera...';
  btn.textContent = '⏳ Starting...';
  btn.disabled = true;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('preview');
    video.srcObject = stream;
    await video.play();
    cameraRunning = true;
    scanning = false;
    statusEl.textContent = 'Point at QR code — scanning...';
    btn.textContent = '⏹ Stop camera';
    btn.className = 'btn-camera stop';
    btn.disabled = false;
    tick();
  } catch (err) {
    statusEl.textContent = 'Camera denied — use manual entry instead.';
    btn.textContent = '▶ Try again';
    btn.disabled = false;
    btn.className = 'btn-camera';
  }
}

function tick() {
  if (!cameraRunning) return;
  const video = document.getElementById('preview');
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx2d.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx2d.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    if (code && !scanning) {
      scanning = true;
      checkInCode(code.data);
      return;
    }
  }
  rafId = requestAnimationFrame(tick);
}

function stopCamera() {
  cameraRunning = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  const video = document.getElementById('preview');
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  scanning = false;
  document.getElementById('camera-status').textContent = 'Tap below to start camera';
  document.getElementById('camera-btn').textContent = '▶ Start camera';
  document.getElementById('camera-btn').className = 'btn-camera';
  document.getElementById('camera-btn').disabled = false;
}

// ── CHECK IN ──────────────────────────────────────────────────────
async function checkInCode(code) {
  if (!code) return;
  code = code.trim().toUpperCase();
  if (code.length < 6) { scanning = false; return; }

  stopCamera();
  document.getElementById('camera-box').style.display = 'none';
  document.getElementById('scan-box').style.display = 'none';
  document.getElementById('result-card').style.display = 'none';

  try {
    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    stats.total++;
    showResult(data);
  } catch (e) {
    scanning = false;
    reset();
    flash('Network error — try again');
  }
}

async function checkIn() {
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  if (!code) return;
  if (code.length < 6) { flash('Enter a valid code'); return; }
  const btn = document.getElementById('check-btn');
  btn.textContent = 'Checking...';
  btn.disabled = true;
  await checkInCode(code);
  btn.textContent = 'Check in guest';
  btn.disabled = false;
}

// ── RESULT ────────────────────────────────────────────────────────
function showResult(data) {
  document.getElementById('camera-box').style.display = 'none';
  document.getElementById('scan-box').style.display = 'none';
  const card = document.getElementById('result-card');
  card.style.display = 'block';

  if (data.valid) {
    stats.checked++;
    card.className = 'result-card valid';
    document.getElementById('result-icon').textContent = '✓';
    document.getElementById('result-status').textContent = 'Valid — Welcome!';
    document.getElementById('result-name').textContent = data.guest_name;
    document.getElementById('result-detail').textContent = data.event_name || '';
    document.getElementById('result-code').textContent = data.invite_code;
    document.getElementById('result-extras').innerHTML =
      (data.plus_one ? '<div class="result-plus">+1 Guest included</div>' : '') +
      (data.table_number ? `<div class="result-table">Table ${data.table_number}</div>` : '');
    document.getElementById('next-btn').className = 'next-btn';
    playBeep(true);
  } else if (data.already_used) {
    stats.rejected++;
    card.className = 'result-card used';
    document.getElementById('result-icon').textContent = '⚠';
    document.getElementById('result-status').textContent = 'Already checked in';
    document.getElementById('result-name').textContent = data.guest_name || '';
    document.getElementById('result-detail').textContent = data.checked_in_at
      ? 'Checked in at ' + new Date(data.checked_in_at).toLocaleTimeString() : '';
    document.getElementById('result-code').textContent = '';
    document.getElementById('result-extras').innerHTML = '';
    document.getElementById('next-btn').className = 'next-btn light';
    playBeep(false);
  } else {
    stats.rejected++;
    card.className = 'result-card invalid';
    document.getElementById('result-icon').textContent = '✕';
    document.getElementById('result-status').textContent = 'Invalid invitation';
    document.getElementById('result-name').textContent = data.reason || 'Not found';
    document.getElementById('result-detail').textContent = 'Do not allow entry';
    document.getElementById('result-code').textContent = '';
    document.getElementById('result-extras').innerHTML = '';
    document.getElementById('next-btn').className = 'next-btn light';
    playBeep(false);
  }
  updateStats();
}

function reset() {
  scanning = false;
  document.getElementById('result-card').style.display = 'none';
  if (currentMode === 'camera') {
    document.getElementById('camera-box').style.display = 'block';
    startCamera();
  } else {
    document.getElementById('scan-box').style.display = 'block';
    document.getElementById('code-input').value = '';
    document.getElementById('code-input').focus();
  }
}

function updateStats() {
  document.getElementById('stat-checked').textContent = stats.checked;
  document.getElementById('stat-rejected').textContent = stats.rejected;
  document.getElementById('stat-total').textContent = stats.total;
}

function flash(msg) {
  const hint = document.getElementById('scan-hint');
  if (!hint) return;
  hint.textContent = msg;
  hint.style.color = '#f87171';
  setTimeout(() => { hint.textContent = 'Type the code or use a hardware QR scanner'; hint.style.color = ''; }, 2500);
}

function playBeep(success) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = success ? 880 : 220;
    o.type = success ? 'sine' : 'square';
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + 0.5);
  } catch(e) {}
}
</script>
</body>
</html>
